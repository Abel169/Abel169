<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Tutoriel · Carte Mastercard Orange Money</title>
<style>
@font-face{font-family:Mont;src:url(fonts/montserrat-latin-500-normal.woff2);font-weight:500}
@font-face{font-family:Mont;src:url(fonts/montserrat-latin-700-normal.woff2);font-weight:700}
@font-face{font-family:Mont;src:url(fonts/montserrat-latin-800-normal.woff2);font-weight:800}
@font-face{font-family:Mont;src:url(fonts/montserrat-latin-900-normal.woff2);font-weight:900}
:root{--o:#FF7900;--o2:#FF9A3C;--bk:#0B0B0D;--g:#9AA0A6}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1080px;height:1920px;overflow:hidden;background:#000}
body{font-family:Mont,sans-serif;color:#fff}
#stage{position:absolute;inset:0;overflow:hidden;background:radial-gradient(ellipse at 100% 0%,rgba(255,121,0,.55) 0%,rgba(255,121,0,0) 45%),radial-gradient(ellipse at 0% 100%,rgba(255,121,0,.45) 0%,rgba(255,121,0,0) 45%),#0B0B0D}
.a{position:absolute;left:0;top:0;will-change:transform,opacity}
.w{display:inline-block;overflow:hidden;vertical-align:top;padding:0 .05em .14em;margin-bottom:-.14em}
.wi{display:inline-block;will-change:transform}
.h{font-weight:900;letter-spacing:-1.5px;line-height:1.05;white-space:nowrap}
svg.ic{fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
/* phone */
.phone{width:520px;height:1080px;border-radius:72px;background:#111;padding:16px;box-shadow:0 0 0 3px #2a2a2e inset,0 0 0 6px rgba(255,121,0,.55),0 50px 120px rgba(255,121,0,.25)}
.scr{position:relative;width:488px;height:1048px;border-radius:56px;overflow:hidden;background:#fff;color:#111}
.cam{position:absolute;left:50%;top:14px;width:22px;height:22px;margin-left:-11px;border-radius:50%;background:#111;z-index:60}
.sb{position:absolute;left:0;right:0;top:0;height:46px;display:flex;justify-content:space-between;padding:14px 34px 0;font-weight:700;font-size:17px;z-index:55}
.pg{position:absolute;inset:0;display:none;overflow:hidden}
.hdr{position:absolute;left:0;right:0;top:46px;height:70px;display:flex;align-items:center;gap:16px;padding:0 26px;font-weight:800;font-size:28px}
.btn{position:absolute;height:66px;border-radius:16px;display:grid;place-items:center;font-weight:800;font-size:22px}
.bq{border:2px solid #222;color:#111;background:#fff}.bo{background:#FF7900;color:#fff}
.fld{position:absolute;left:30px;right:30px;border-bottom:2px solid #ddd;padding-bottom:6px}
.fld .l{font-size:15px;color:#888;font-weight:700}.fld .v{font-size:22px;font-weight:700;min-height:30px;margin-top:2px}
.sheet{position:absolute;left:0;right:0;bottom:0;border-radius:34px 34px 0 0;background:#fff;box-shadow:0 -20px 60px rgba(0,0,0,.3)}
.dim{position:absolute;inset:0;background:rgba(0,0,0,.45)}
.tap{position:absolute;width:64px;height:64px;margin:-32px;border-radius:50%;background:rgba(255,121,0,.35);border:4px solid #FF7900;z-index:70;pointer-events:none}
.finger{position:absolute;z-index:71;pointer-events:none}
.key{position:absolute;width:86px;height:86px;border-radius:50%;border:2px solid #FFB066;display:grid;place-items:center;font-weight:700;font-size:32px;color:#333}
.chipA{position:absolute;width:132px;height:52px;border-radius:14px;border:2px solid #ccc;background:#f1f1f1;display:grid;place-items:center;font-weight:800;font-size:18px}
/* stepper */
.st{position:absolute;width:70px;text-align:center}
.st .c{width:58px;height:58px;margin:0 auto;border-radius:50%;border:3px solid #444;display:grid;place-items:center;font-weight:900;font-size:24px;color:#777;background:#151517}
.st .t{margin-top:8px;font-weight:700;font-size:17px;color:#777;white-space:nowrap;margin-left:-30px;margin-right:-30px}
/* card */
.card{width:760px;height:480px;border-radius:36px;position:relative;overflow:hidden;background:radial-gradient(ellipse at 80% 0%,#2b2b2f 0%,#0b0b0d 60%);box-shadow:0 40px 100px rgba(0,0,0,.6),0 0 0 2px rgba(255,255,255,.08) inset}
#grain{position:absolute;inset:0;width:1080px;height:1920px;mix-blend-mode:overlay;opacity:.05;pointer-events:none;z-index:90}
#sig{position:absolute;left:0;width:1080px;top:1866px;text-align:center;font-weight:700;font-size:20px;letter-spacing:9px;color:rgba(255,255,255,.65);z-index:95}
</style>
</head>
<body><div id="stage">
<div class="a" style="top:190px;left:-40px;font-weight:900;font-size:230px;white-space:nowrap;color:transparent;-webkit-text-stroke:2px rgba(255,255,255,.07)">MASTERCARD · ORANGE</div>
<div class="a" style="left:0;width:1080px;top:300px;text-align:center"><span style="padding:12px 30px;border-radius:40px;background:#fff;color:#111;font-weight:800;font-size:26px">TUTO · PAS À PAS</span></div>
<div class="a h" style="width:1080px;text-align:center;top:390px;font-size:92px">TA CARTE</div>
<div class="a h" style="width:1080px;text-align:center;top:490px;font-size:104px;color:#FF7900">MASTERCARD</div>
<div class="a" style="width:1080px;text-align:center;top:615px;font-weight:800;font-size:48px">avec <span style="color:#FF7900">Orange Money</span></div>
<div class="a" style="left:160px;top:760px;transform:rotate(-8deg) scale(1)"><div class="card" id="card">
    <div id="cdots"></div>
    <div style="position:absolute;left:46px;top:150px;width:96px;height:72px;border-radius:12px;background:linear-gradient(135deg,#E9C46A,#B8892E)"></div>
    <div style="position:absolute;right:44px;top:40px;font-weight:800;font-size:30px;color:#fff;text-align:right;line-height:1.05">Orabank <span style="color:#555">|</span> <span style="color:#FF7900">Orange Money</span></div>
    <div style="position:absolute;left:46px;top:262px;font-weight:700;font-size:46px;letter-spacing:6px">•••• •••• •••• 0000</div>
    <div style="position:absolute;left:46px;top:340px;font-size:18px;color:#aaa;font-weight:700">EXPIRE À FIN <span style="color:#fff;font-size:26px;margin-left:8px">MM/AA</span></div>
    <div style="position:absolute;left:46px;top:395px;font-weight:800;font-size:22px;letter-spacing:3px;color:#FF9A3C">PRÉPAYÉE · VIRTUELLE</div>
    <div style="position:absolute;right:44px;bottom:36px;font-weight:800;font-size:30px;font-style:italic;color:#fff">Mastercard</div>
    <div id="shine" style="position:absolute;top:-50%;width:180px;height:200%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.35),transparent);transform:rotate(20deg)"></div>
    <div style="position:absolute;left:0;right:0;top:46%;text-align:center;font-weight:900;font-size:34px;letter-spacing:14px;color:rgba(255,255,255,.12)">SPÉCIMEN</div>
  </div></div>
<div class="a" style="width:1080px;text-align:center;top:1330px"><span style="display:inline-block;padding:20px 44px;border-radius:50px;background:#FF7900;font-weight:900;font-size:46px;box-shadow:0 16px 40px rgba(255,121,0,.45)">En 8 étapes · 1 000 FCFA</span></div>
<div class="a" style="width:1080px;text-align:center;top:1460px;font-weight:800;font-size:34px;color:#FF9A3C">▹ Achète en ligne dès aujourd'hui</div>
<div class="a" style="width:1080px;text-align:center;top:1866px;font-weight:700;font-size:20px;letter-spacing:9px;color:rgba(255,255,255,.65)">TUTORIEL · SOGOBA CRÉATIVE</div>
</div>
<script>let seed=5;const rnd=()=>{seed=(seed*16807)%2147483647;return(seed-1)/2147483646};
document.getElementById('cdots').innerHTML=Array.from({length:160},()=>{const a=rnd()*Math.PI*2,r=Math.sqrt(rnd());const x=470+Math.cos(a)*r*330,y=230+Math.sin(a)*r*300;return x<760&&y<480?`<span style="position:absolute;left:${x}px;top:${y}px;width:7px;height:7px;border-radius:50%;background:rgba(255,255,255,.12)"></span>`:''}).join('');
document.getElementById('shine').style.left='55%';
window.ready=document.fonts.ready;</script></body></html>
