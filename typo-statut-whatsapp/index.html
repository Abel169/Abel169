<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><title>Typo · Statut WhatsApp</title>
<style>
@font-face{font-family:Unb;src:url(fonts/unbounded-latin-900-normal.woff2);font-weight:900}
@font-face{font-family:Unb;src:url(fonts/unbounded-latin-500-normal.woff2);font-weight:500}
@font-face{font-family:DM;src:url(fonts/dm-sans-latin-700-normal.woff2);font-weight:700}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1080px;height:1920px;overflow:hidden;background:#000}
#stage{position:absolute;inset:0;overflow:hidden}
.card{position:absolute;inset:0;display:none}
.ln{position:absolute;left:70px;white-space:nowrap;font-family:Unb;font-weight:900;line-height:.92;letter-spacing:-.04em;transform-origin:0 50%}
.ln .in{display:inline-block;will-change:transform,filter}
.clip{overflow:hidden;padding-bottom:.12em}
.box{display:inline-block;padding:.06em .18em .12em}
.lab{font-family:DM;font-weight:700;letter-spacing:.3em}
.strike{position:absolute;left:-10px;top:50%;height:.14em;background:#FE2C55;transform-origin:0 50%}
#prog{position:absolute;left:0;top:0;height:14px;z-index:20}
#sig{position:absolute;left:70px;bottom:70px;font-family:DM;font-weight:700;font-size:24px;letter-spacing:.3em;z-index:20}
#grain{position:absolute;inset:0;width:1080px;height:1920px;mix-blend-mode:multiply;opacity:.08;pointer-events:none;z-index:30}
</style></head><body>
<div id="stage"></div>
<div id="prog"></div>
<div id="sig">SOGOBA CRÉATIVE</div>
<canvas id="grain" width="360" height="640"></canvas>
<script>
const $=id=>document.getElementById(id);
const clamp=(x,a=0,b=1)=>Math.min(b,Math.max(a,x));
const seg=(t,a,b)=>clamp((t-a)/(b-a));
const EZ={outExpo:x=>x>=1?1:1-Math.pow(2,-10*x),outBack:x=>{const c1=1.9,c3=c1+1;return 1+c3*Math.pow(x-1,3)+c1*Math.pow(x-1,2)},outCubic:x=>1-Math.pow(1-x,3),inCubic:x=>x*x*x};
const E=(t,a,b,e='outExpo')=>EZ[e](seg(t,a,b));
const Y='#FFE600',K='#0A0A0A',W='#F5F2EA',R='#FE2C55',G='#14B85A';

/* card: [start, bg, fg, lines]  line: [text, size, dt, anim, opts]
   anim: up | slam | blur | type | pop ; opts: {c:color, box:bg, lab:true, strike:dt, out:false} */
const CARDS=[
 [0.0, Y,K,[['TON',300,0,'slam'],['STATUT',236,.22,'slam'],['WHATSAPP',150,.44,'slam',{box:K,c:Y}]]],
 [1.35,K,Y,[['NE VEND',210,0,'up'],['PAS ?',330,.2,'slam']]],
 [2.45,W,K,[['3',760,0,'slam',{c:R}],['RAISONS.',170,.25,'up']]],
 [3.55,K,W,[['RAISON 1',34,0,'type',{lab:true,c:Y}],['TU POSTES',150,.12,'up'],['SANS',230,.32,'up'],['PRIX.',300,.5,'slam',{c:Y,strike:1.15}]]],
 [5.35,Y,K,[['LE CLIENT',150,0,'up'],['NE DEMANDE',140,.18,'up'],['PAS.',300,.4,'slam'],['Il passe au statut suivant.',40,.75,'type',{lab:true}]]],
 [6.9, W,K,[['✓ SOLUTION',34,0,'type',{lab:true,c:G}],['METS',260,.12,'up'],['LE PRIX.',220,.3,'slam'],['12 500 F',170,.6,'pop',{box:R,c:W}]]],
 [8.6, K,W,[['RAISON 2',34,0,'type',{lab:true,c:Y}],['PHOTO',300,.12,'up'],['FLOUE.',300,.32,'blur']]],
 [10.1,Y,K,[['✓ SOLUTION',34,0,'type',{lab:true,c:K}],['LUMIÈRE',200,.12,'up'],['DU JOUR',200,.3,'up'],['+ FOND',200,.5,'up'],['PROPRE.',200,.68,'slam',{box:K,c:Y}]]],
 [12.0,K,W,[['RAISON 3',34,0,'type',{lab:true,c:Y}],['TU NE DIS',170,.12,'up'],['PAS QUOI',170,.3,'up'],['FAIRE.',290,.5,'slam',{c:R}]]],
 [13.8,W,K,[['✓ SOLUTION',34,0,'type',{lab:true,c:G}],['TERMINE PAR :',110,.12,'up'],['« ÉCRIS-MOI',150,.35,'up'],['COMMANDE »',150,.55,'slam',{box:G,c:W}]]],
 [15.9,Y,K,[['ET TON',200,0,'up'],['STATUT',260,.18,'up'],['VA VENDRE.',190,.4,'slam',{box:K,c:Y}]]],
 [17.4,K,Y,[['LAQUELLE',190,0,'up'],['TU FAIS',220,.18,'up'],['ENCORE ?',220,.36,'slam'],['Réponds en commentaire ↓',40,.8,'type',{lab:true,c:W}]]],
 [19.2,W,K,[['ENREGISTRE',150,0,'slam'],['POUR PLUS',150,.2,'up'],['TARD.',260,.4,'slam',{c:R}],['@sogobacreative',70,.8,'pop',{box:K,c:Y}]]]];
const END=21.5;

/* build */
const stage=$('stage');const built=CARDS.map(([t0,bg,fg,lines],ci)=>{const c=document.createElement('div');c.className='card';c.style.background=bg;stage.appendChild(c);
 const els=lines.map(([txt,size,dt,an,o={}])=>{const d=document.createElement('div');d.className='ln'+(an==='up'?' clip':'');d.style.fontSize=size+'px';
   if(o.lab)d.style.fontFamily='DM';
   const inn=document.createElement('span');inn.className='in';const body=o.box?`<span class="box" style="background:${o.box};color:${o.c||fg}">${txt}</span>`:txt;
   inn.innerHTML=an==='type'?`<span class="tt" data-t="${txt}"></span>`:body;inn.style.color=o.c||fg;if(o.lab)inn.classList.add('lab');
   d.appendChild(inn);if(o.strike!==undefined){const s=document.createElement('div');s.className='strike';inn.style.position='relative';inn.appendChild(s);}
   c.appendChild(d);return {d,inn,size,dt,an,o,txt}});
 return {c,t0,bg,fg,els}});

/* layout: fit width, stack vertically centred */
const FONTS_LOADED=Promise.all(['900 100px Unb','500 100px Unb','700 40px DM'].map(f=>document.fonts.load(f)));
const LAYOUT=FONTS_LOADED.then(()=>{built.forEach(b=>{b.c.style.display='block';let h=0;
  b.els.forEach(e=>{if(e.an==='type'){e.inn.querySelector('.tt').textContent=e.txt}
    const w=e.inn.scrollWidth;if(w>930){const f=e.size*930/w;e.d.style.fontSize=f+'px';e.size=f}
    if(e.an==='type')e.inn.querySelector('.tt').textContent='';
    e.h=e.size*(e.o.lab?1.6:(e.o.box?1.12:0.98))});
  b.els.forEach(e=>h+=e.h);let y=930-h/2;b.els.forEach(e=>{e.d.style.top=y+'px';y+=e.h});b.c.style.display='none'})});

const gctx=$('grain').getContext('2d');const gimg=gctx.createImageData(360,640);
function grain(f){let s=(f*7919+13)%2147483647||1;const d=gimg.data;for(let i=0;i<d.length;i+=4){s=(s*16807)%2147483647;const v=128+(s&127);d[i]=d[i+1]=d[i+2]=v;d[i+3]=255}gctx.putImageData(gimg,0,0)}

function render(t,frame){
  let cur=0;CARDS.forEach((c,i)=>{if(t>=c[0])cur=i});
  built.forEach((b,i)=>{b.c.style.display=i===cur?'block':'none'});
  const b=built[cur],lt=t-b.t0,next=(CARDS[cur+1]||[END])[0],dur=next-b.t0;
  // whole card: slow push + exit punch
  const out=E(t,next-.12,next,'inCubic');
  b.c.style.transform=`scale(${1.06-0.06*E(lt,0,dur*.9,'outCubic')+out*.08}) rotate(${(cur%2?-1:1)*out*1.5}deg)`;
  const fg=b.fg;$('sig').style.color=b.bg===K?'rgba(245,242,234,.6)':'rgba(10,10,10,.55)';
  $('prog').style.width=(t/END*1080)+'px';$('prog').style.background=b.bg===Y?K:Y;
  let shake=0;
  b.els.forEach(e=>{const a=e.dt,p=lt-a;const st=e.inn.style;st.filter='';
    if(p<0){st.opacity=0;return}st.opacity=1;
    if(e.an==='up'){st.transform=`translateY(${(1-E(p,0,.38))*110}%)`}
    else if(e.an==='slam'){const k=E(p,0,.22,'outCubic');st.transform=`scale(${1.7-0.7*k})`;st.opacity=clamp(k*2);if(p<.3)shake=Math.max(shake,(1-p/.3)*14)}
    else if(e.an==='blur'){const k=E(p,0,.9,'outCubic');st.filter=`blur(${(1-k)*26+ (Math.sin(lt*7)*.5+.5)*4*(1-k)}px)`;st.transform=`scale(${1.08-0.08*k})`}
    else if(e.an==='pop'){const k=E(p,0,.4,'outBack');st.transform=`scale(${k}) rotate(${-4*(1-clamp(p*3))-2}deg)`}
    else if(e.an==='type'){const tt=e.inn.querySelector('.tt');tt.textContent=e.txt.slice(0,Math.floor(clamp(p/(.03*e.txt.length+.05))*e.txt.length))}
    const s=e.inn.querySelector('.strike');if(s){const sp=E(lt,e.o.strike,e.o.strike+.25);s.style.width=(sp*104)+'%';s.style.transform=`rotate(-4deg)`}
  });
  stage.style.transform=`translate(${Math.sin(t*93)*shake}px,${Math.cos(t*71)*shake}px)`;
  grain(frame);
}
window.render=render;window.ready=LAYOUT.then(()=>new Promise(r=>setTimeout(r,50)));
</script></body></html>
