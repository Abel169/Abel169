<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Offre de lancement</title>
<style>
@font-face{font-family:Sora;src:url(fonts/sora-latin-600-normal.woff2);font-weight:600}
@font-face{font-family:Sora;src:url(fonts/sora-latin-700-normal.woff2);font-weight:700}
@font-face{font-family:Sora;src:url(fonts/sora-latin-800-normal.woff2);font-weight:800}
@font-face{font-family:Outfit;src:url(fonts/outfit-latin-400-normal.woff2);font-weight:400}
@font-face{font-family:Outfit;src:url(fonts/outfit-latin-600-normal.woff2);font-weight:600}
@font-face{font-family:Outfit;src:url(fonts/outfit-latin-700-normal.woff2);font-weight:700}
@font-face{font-family:Play;src:url(fonts/playfair-display-latin-500-italic.woff2);font-weight:500;font-style:italic}
@font-face{font-family:Play;src:url(fonts/playfair-display-latin-700-italic.woff2);font-weight:700;font-style:italic}
:root{--bg:#07070A;--c1:#25F4EE;--c2:#8B5CF6;--c3:#FE2C55;--gold:#FFC83D;--gr:linear-gradient(100deg,#25F4EE 0%,#8B5CF6 50%,#FE2C55 100%)}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1080px;height:1920px;overflow:hidden;background:#000}
body{font-family:Outfit,sans-serif;color:#fff}
#stage{position:absolute;inset:0;overflow:hidden;background:var(--bg)}
#world{position:absolute;inset:0}
.scene{position:absolute;inset:0;overflow:hidden;display:none}
.a{position:absolute;left:0;top:0;will-change:transform,opacity}
.w{display:inline-block;overflow:hidden;vertical-align:top;padding:0 .05em .16em;margin-bottom:-.16em}
.wi{display:inline-block;will-change:transform}
.h{font-family:Sora;font-weight:800;letter-spacing:-4px;white-space:nowrap;line-height:1.04}
.grad{background:var(--gr);-webkit-background-clip:text;background-clip:text;color:transparent}
.grad .wi{background:var(--gr);-webkit-background-clip:text;background-clip:text;color:transparent;background-repeat:no-repeat}
.grad:has(.wi){background:none}
.pf{font-family:Play;font-style:italic;font-weight:500}
svg.ic{fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.blob{border-radius:50%;filter:blur(90px)}
.label{font-family:Sora;font-weight:700;font-size:26px;letter-spacing:8px;white-space:nowrap;color:#9CA3AF}
.mono{border-radius:50%;position:relative}
.mono .ring{position:absolute;inset:0;border-radius:50%;background:conic-gradient(from 0deg,#25F4EE,#8B5CF6,#FE2C55,#25F4EE)}
.mono .in{position:absolute;inset:12px;border-radius:50%;background:url(assets/profile.jpg) center 30%/cover;border:8px solid #07070A}
.pcard{width:940px;padding:34px 40px;border-radius:40px;background:linear-gradient(160deg,#17171f,#0d0d12);border:2px solid rgba(255,255,255,.12);box-shadow:0 40px 100px rgba(0,0,0,.55)}
#grain{position:absolute;inset:0;width:1080px;height:1920px;mix-blend-mode:overlay;opacity:.09;pointer-events:none}
#vig{position:absolute;inset:0;background:radial-gradient(ellipse at center,rgba(0,0,0,0) 55%,rgba(0,0,0,.45) 100%);pointer-events:none}
#flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none}
</style>
</head>
<body>
<div id="stage"><div id="world">

<!-- S1 HOOK 0–3.5 -->
<div class="scene" id="s1">
  <div class="a blob" id="s1b1" style="width:900px;height:900px;background:#FE2C55;opacity:.22"></div>
  <div class="a label" id="s1lab" style="left:72px;top:190px;color:#FE2C55">COMMERÇANTS · ENTREPRENEURS</div>
  <div class="a h" id="s1a" style="left:66px;top:250px;font-size:130px"></div>
  <div class="a h" id="s1b" style="left:66px;top:560px;font-size:84px;color:#9CA3AF;letter-spacing:-3px"></div>
  <div class="a" id="s1post" style="width:640px;border-radius:34px;overflow:hidden;background:#15151b;border:2px solid rgba(255,255,255,.1);box-shadow:0 40px 100px rgba(0,0,0,.6)">
    <div style="height:640px;background:url(assets/w_meuble.jpg) center/cover;filter:grayscale(1) brightness(.75)"></div>
    <div style="padding:24px 30px;display:flex;justify-content:space-between;align-items:center;color:#6B7280;font-size:30px;font-weight:600">
      <span style="display:flex;align-items:center;gap:10px"><svg class="ic" width="34" height="34" viewBox="0 0 24 24"><path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></svg><span id="s1views">12</span> vues</span>
      <span style="display:flex;align-items:center;gap:10px"><svg class="ic" width="34" height="34" viewBox="0 0 24 24"><path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z"/></svg>0</span></div>
  </div>
  <div class="a" id="s1zzz" style="font-family:Sora;font-weight:800;font-size:64px;color:#6B7280">z z z</div>
</div>

<!-- S2 BEFORE/AFTER 3.5–8 -->
<div class="scene" id="s2">
  <img class="a" id="s2bg" style="width:1300px;height:2310px;object-fit:cover;filter:blur(50px) brightness(.4) saturate(1.3)">
  <div class="a h" id="s2t1" style="width:1080px;text-align:center;top:150px;font-size:92px"></div>
  <div class="a h grad" id="s2t2" style="width:1080px;text-align:center;top:255px;font-size:92px;padding-bottom:10px"></div>
  <div class="a" id="s2card" style="width:780px;height:1386px;border-radius:44px;overflow:hidden;box-shadow:0 60px 140px rgba(0,0,0,.7),0 0 0 3px rgba(255,255,255,.14)">
    <img id="s2after" style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover">
    <div id="s2before" style="position:absolute;inset:0;background:url(../sogoba-promo/clips/sg1_063.jpg) center/cover;filter:grayscale(1) brightness(.75) blur(1px)"></div>
    <div id="s2line" style="position:absolute;top:0;bottom:0;width:8px;margin-left:-4px;background:#fff;box-shadow:0 0 30px #25F4EE,0 0 60px #8B5CF6"></div>
  </div>
  <div class="a" id="s2tagA" style="padding:14px 30px;border-radius:30px;background:rgba(0,0,0,.65);font-family:Sora;font-weight:800;font-size:34px;letter-spacing:4px;color:#9CA3AF">AVANT</div>
  <div class="a" id="s2tagB" style="padding:14px 30px;border-radius:30px;background:var(--gr);font-family:Sora;font-weight:800;font-size:34px;letter-spacing:4px;color:#07070A">APRÈS</div>
</div>

<!-- S3 OFFER 8–11 -->
<div class="scene" id="s3">
  <div class="a" id="s3rays" style="width:2800px;height:2800px;border-radius:50%;background:repeating-conic-gradient(from 0deg,rgba(139,92,246,.14) 0deg 6deg,transparent 6deg 18deg);-webkit-mask-image:radial-gradient(circle,#000 10%,transparent 60%)"></div>
  <div class="a blob" id="s3b1" style="width:1000px;height:1000px;background:#8B5CF6;opacity:.35"></div>
  <div class="a h" id="s3a" style="width:1080px;text-align:center;font-size:120px;letter-spacing:-3px"></div>
  <div class="a h grad" id="s3b" style="width:1080px;text-align:center;font-size:124px;letter-spacing:-7px;padding-bottom:16px"></div>
  <div class="a" id="s3seats" style="width:1080px;display:flex;justify-content:center;gap:22px"></div>
  <div class="a" id="s3c" style="width:1080px;text-align:center;font-family:Sora;font-weight:800;font-size:64px;letter-spacing:2px;color:var(--gold)">5 PLACES SEULEMENT</div>
  <div id="s3conf"></div>
</div>

<!-- S4 PRICES 11–18 -->
<div class="scene" id="s4">
  <div class="a blob" id="s4b1" style="width:1000px;height:1000px;background:#25F4EE;opacity:.15"></div>
  <div class="a blob" id="s4b2" style="width:900px;height:900px;background:#FE2C55;opacity:.18"></div>
  <div class="a label" id="s4lab" style="left:72px;top:170px;color:var(--gold)">PRIX DE LANCEMENT</div>
  <div class="a h" id="s4h" style="left:66px;top:220px;font-size:112px"></div>
  <div id="s4cards"></div>
</div>

<!-- S5 INCLUDED 18–21.5 -->
<div class="scene" id="s5">
  <div class="a blob" id="s5b1" style="width:900px;height:900px;background:#8B5CF6;opacity:.25"></div>
  <div class="a label" id="s5lab" style="left:72px;top:400px">INCLUS DANS CHAQUE PACK</div>
  <div id="s5list"></div>
</div>

<!-- S6 CTA 21.5–26 -->
<div class="scene" id="s6">
  <div class="a blob" id="s6b1" style="width:1100px;height:1100px;background:#8B5CF6;opacity:.3"></div>
  <div class="a blob" id="s6b2" style="width:800px;height:800px;background:#FE2C55;opacity:.25"></div>
  <div id="s6rings"></div>
  <div class="a mono" id="s6mono" style="width:320px;height:320px"><div class="ring" id="s6ring"></div><div class="in"></div></div>
  <div class="a h" id="s6a" style="width:1080px;text-align:center;font-size:118px"></div>
  <div class="a h grad" id="s6b" style="width:1080px;text-align:center;font-size:118px;padding-bottom:12px"></div>
  <div class="a" id="s6dm" style="display:flex;align-items:center;gap:18px;padding:28px 50px;border-radius:30px;background:#FE2C55;font-family:Sora;font-weight:800;font-size:46px;white-space:nowrap;box-shadow:0 24px 60px rgba(254,44,85,.5)">
    <svg class="ic" width="50" height="50" viewBox="0 0 24 24" style="stroke-width:2.4"><rect width="20" height="16" x="2" y="4" rx="2"/><path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/></svg>Écris-moi en DM</div>
  <div class="a h grad" id="s6at" style="font-size:80px;letter-spacing:-4px;padding-bottom:14px"></div>
  <div class="a" id="s6left" style="font-family:Sora;font-weight:700;font-size:34px;color:var(--gold);white-space:nowrap"></div>
</div>

</div>
<div id="flash"></div>
<div id="vig"></div>
<canvas id="grain" width="360" height="640"></canvas>
</div>

<script>
const $=id=>document.getElementById(id);
const clamp=(x,a=0,b=1)=>Math.min(b,Math.max(a,x));
const lerp=(a,b,t)=>a+(b-a)*t;
const seg=(t,a,b)=>clamp((t-a)/(b-a));
const EZ={lin:x=>x,outCubic:x=>1-Math.pow(1-x,3),inOutCubic:x=>x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2,
 outExpo:x=>x>=1?1:1-Math.pow(2,-10*x),inExpo:x=>x<=0?0:Math.pow(2,10*x-10),
 outBack:x=>{const c1=1.9,c3=c1+1;return 1+c3*Math.pow(x-1,3)+c1*Math.pow(x-1,2)}};
const E=(t,a,b,e='outExpo')=>EZ[e](seg(t,a,b));
function tf(el,o){const {x=0,y=0,z=0,s=1,sx,sy,r=0,rx=0,ry=0,c=true,op,blur}=o;
  el.style.transform=`translate3d(${x}px,${y}px,${z}px)${c?' translate(-50%,-50%)':''} rotateX(${rx}deg) rotateY(${ry}deg) rotate(${r}deg) scale(${sx??s},${sy??s})`;
  if(op!==undefined)el.style.opacity=op; if(blur!==undefined)el.style.filter=blur>0.05?`blur(${blur}px)`:'none';}
let seed=55;const rnd=()=>{seed=(seed*16807)%2147483647;return(seed-1)/2147483646};
function show(id,t,a,b){const v=t>=a&&t<b;$(id).style.display=v?'block':'none';return v}
const wordsHTML=txt=>txt.split(' ').map(w=>`<span class="w"><span class="wi">${w}</span></span>`).join(' ');
const charsHTML=txt=>[...txt].map(c=>`<span class="w"><span class="wi">${c===' '?'&nbsp;':c}</span></span>`).join('');
function animWords(el,t,t0,stag=.06,dur=.6,from=115){el.querySelectorAll('.wi').forEach((w,i)=>{const p=E(t,t0+i*stag,t0+i*stag+dur);w.style.transform=`translateY(${(1-p)*from}%) rotate(${(1-p)*6}deg)`})}
const setSrc=(img,src)=>{if(img.getAttribute('src')!==src)img.setAttribute('src',src)};
const fmt=n=>String(Math.round(n)).replace(/\B(?=(\d{3})+(?!\d))/g,' ');
const CLIP=(k,lt,n)=>`../sogoba-promo/clips/${k}_${String(clamp(Math.floor(lt*30)+1,1,n)).padStart(3,'0')}.jpg`;

/* ======= PRIX (à modifier ici) ======= */
const PACKS=[['Starter','1 pub de 15 s avec vos photos + musique',30000,20000],
             ['Pro','Pub 30 s motion design + voix off',60000,40000],
             ['Campagne','3 pubs + 3 visuels réseaux sociaux',135000,90000]];
const INCL=[['Livraison en 48 h','clock'],['2 modifications incluses','edit'],['Paiement Orange Money','phone'],['Formats TikTok, WhatsApp, Facebook','grid']];
const IC={clock:'<circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/>',edit:'<path d="M12 20h9M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z"/>',
 phone:'<rect width="14" height="20" x="5" y="2" rx="2"/><path d="M12 18h.01"/>',grid:'<rect width="7" height="7" x="3" y="3" rx="1"/><rect width="7" height="7" x="14" y="3" rx="1"/><rect width="7" height="7" x="14" y="14" rx="1"/><rect width="7" height="7" x="3" y="14" rx="1"/>',
 ticket:'<path d="M2 9a3 3 0 0 1 0 6v2a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-2a3 3 0 0 1 0-6V7a2 2 0 0 0-2-2H4a2 2 0 0 0-2 2Z"/><path d="M13 5v2M13 17v2M13 11v2"/>'};

/* build */
$('s1a').innerHTML=`<div>${wordsHTML('Tu as un')}</div><div>${wordsHTML('commerce ?')}</div>`;
$('s1b').innerHTML=`<div>${wordsHTML('Tes photos ne')}</div><div>${wordsHTML('vendent pas ?')}</div>`;
$('s2t1').innerHTML=wordsHTML('Je les transforme');$('s2t2').innerHTML=wordsHTML('en pubs qui vendent.');
$('s3a').innerHTML=wordsHTML('OFFRE DE');$('s3b').innerHTML=charsHTML('LANCEMENT');
$('s3seats').innerHTML=Array.from({length:5},(_,i)=>`<div class="seat" style="width:150px;height:150px;border-radius:36px;background:var(--gr);display:grid;place-items:center;color:#07070A;box-shadow:0 20px 50px rgba(139,92,246,.45)"><div style="text-align:center"><svg class="ic" width="56" height="56" viewBox="0 0 24 24" style="stroke-width:2.2">${IC.ticket}</svg><div style="font-family:Sora;font-weight:800;font-size:30px;line-height:1">${i+1}</div></div></div>`).join('');
$('s3conf').innerHTML=Array.from({length:60},()=>{const a=rnd()*Math.PI*2,v=600+rnd()*1200;return `<div class="a cf" data-vx="${Math.cos(a)*v}" data-vy="${Math.sin(a)*v-900}" data-r="${rnd()*900-450}" style="width:${12+rnd()*14}px;height:${7+rnd()*8}px;border-radius:2px;background:${['#25F4EE','#8B5CF6','#FE2C55','#FFC83D','#fff'][Math.floor(rnd()*5)]}"></div>`}).join('');
$('s4h').innerHTML=wordsHTML('−33 % sur tout');
$('s4cards').innerHTML=PACKS.map(([n,d,o,p],i)=>`<div class="a pcard s4c">
  <div style="display:flex;justify-content:space-between;align-items:center"><div class="h" style="font-size:52px;letter-spacing:-1.5px">${n}</div>
   <div class="s4badge" style="padding:10px 22px;border-radius:24px;background:var(--gold);color:#07070A;font-family:Sora;font-weight:800;font-size:28px">−33 %</div></div>
  <div style="font-size:28px;color:#9CA3AF;margin-top:6px">${d}</div>
  <div style="display:flex;align-items:baseline;gap:28px;margin-top:18px">
   <div style="position:relative;font-family:Sora;font-weight:700;font-size:40px;color:#6B7280;white-space:nowrap">${fmt(o)}<div class="s4strike" style="position:absolute;left:-6px;right:-6px;top:52%;height:5px;border-radius:3px;background:#FE2C55;transform-origin:0 50%"></div></div>
   <div class="s4new grad h" style="font-size:84px;letter-spacing:-3px;padding-bottom:6px"><span class="s4n">${fmt(p)}</span> <small style="font-size:36px;letter-spacing:0">FCFA</small></div></div></div>`).join('');
$('s5list').innerHTML=INCL.map(([t,ic])=>`<div class="a s5i" style="display:flex;align-items:center;gap:30px;white-space:nowrap"><div style="width:108px;height:108px;border-radius:30px;background:var(--gr);display:grid;place-items:center;color:#07070A"><svg class="ic" width="56" height="56" viewBox="0 0 24 24" style="stroke-width:2.3">${IC[ic]}</svg></div><span class="h" style="font-size:58px;letter-spacing:-2px;white-space:normal;width:760px">${t}</span></div>`).join('');
$('s6rings').innerHTML=Array.from({length:5},()=>'<div class="a rg" style="width:320px;height:320px;border-radius:50%;border:3px solid rgba(139,92,246,.6)"></div>').join('');
$('s6a').innerHTML=wordsHTML('Réserve');$('s6b').innerHTML=wordsHTML('ta place.');
$('s6at').innerHTML=charsHTML('@sogobacreative');

const gctx=$('grain').getContext('2d');const gimg=gctx.createImageData(360,640);
function grain(f){let s=(f*7919+13)%2147483647||1;const d=gimg.data;for(let i=0;i<d.length;i+=4){s=(s*16807)%2147483647;const v=s&255;d[i]=d[i+1]=d[i+2]=v;d[i+3]=255}gctx.putImageData(gimg,0,0)}

function render(t,frame){
  let shx=0,shy=0;for(const [st,a] of [[3.5,10],[5.0,8],[8.0,16],[11.0,8],[12.4,6],[13.9,6],[15.4,8],[21.5,10],[24.0,8]]){const k=seg(t,st,st+.35);if(k>0&&k<1){const m=a*(1-k)**2;shx+=Math.sin(t*95)*m;shy+=Math.cos(t*81)*m}}
  $('world').style.transform=`translate(${shx}px,${shy}px)`;
  let fl=0;for(const [st,a] of [[3.5,.4],[5.0,.35],[8.0,.7],[11.0,.3],[21.5,.35]]){const k=seg(t,st,st+.4);if(t>=st&&k<1)fl=Math.max(fl,a*(1-EZ.outCubic(k)))}
  $('flash').style.opacity=fl;

  /* S1 0–3.5 */
  if(show('s1',t,0,3.55)){
    tf($('s1b1'),{x:800+Math.sin(t)*80,y:500});
    tf($('s1lab'),{c:false,op:E(t,.05,.4)});
    animWords($('s1a'),t,.1,.08,.55);animWords($('s1b'),t,.75,.08,.55);
    const pp=E(t,1.2,1.8);tf($('s1post'),{x:540,y:1330+(1-pp)*500+Math.sin(t*1.5)*6,r:-4+(1-pp)*-10,op:pp});
    $('s1views').textContent=t<1.9?'0':String(Math.min(12,Math.floor((t-1.9)*20)));
    const z=E(t,2.1,2.5);tf($('s1zzz'),{x:840,y:1060-((t-2.1)*40),op:z*(1-E(t,3.0,3.3,'lin')),r:-10});
    const ex=E(t,3.15,3.55,'inExpo');$('s1').style.transform=`scale(${1+ex*.2})`;$('s1').style.filter=ex>.01?`blur(${ex*14}px) grayscale(${ex})`:'none';
  }

  /* S2 3.5–8 */
  if(show('s2',t,3.5,8.05)){
    const lt=Math.max(0,t-4.6);const src=CLIP('sg1',lt,63);setSrc($('s2after'),src);setSrc($('s2bg'),src);
    tf($('s2bg'),{x:540,y:960});$('s2bg').style.filter=`blur(50px) brightness(.4) saturate(${t>5?1.3:0})`;
    animWords($('s2t1'),t,3.55,.08,.55);animWords($('s2t2'),t,3.8,.08,.55);
    const cp=E(t,3.6,4.2);tf($('s2card'),{x:540,y:1150+(1-cp)*900+Math.sin(t*1.5)*6,r:(1-cp)*6});
    const wp=E(t,4.7,5.3,'inOutCubic');$('s2before').style.clipPath=`inset(0 0 0 ${wp*100}%)`;
    $('s2line').style.left=(wp*100)+'%';$('s2line').style.opacity=t>4.7&&t<5.4?1:0;
    const ta=E(t,4.1,4.4,'outBack');tf($('s2tagA'),{x:540,y:560,s:ta*(1-E(t,4.9,5.1,'lin')),op:clamp(ta*3)*(1-E(t,4.9,5.1,'lin'))});
    const tb=E(t,5.1,5.4,'outBack');tf($('s2tagB'),{x:540,y:560,s:tb,op:clamp(tb*3)});
    const ex=E(t,7.6,8.05,'inExpo');$('s2').style.transform=`scale(${1+ex*.3})`;$('s2').style.opacity=1-ex;
  }

  /* S3 8–11 */
  if(show('s3',t,7.95,11.05)){
    tf($('s3rays'),{x:540,y:900,r:t*14,op:E(t,8,8.4,'lin')});tf($('s3b1'),{x:540,y:900});
    animWords($('s3a'),t,8.0,.08,.45);tf($('s3a'),{c:false,x:0,y:560});
    $('s3b').querySelectorAll('.wi').forEach((w,i)=>{const p=E(t,8.15+i*.035,8.6+i*.035,'outBack');w.style.transform=`translateY(${(1-p)*120}%) scale(${lerp(1.6,1,p)})`});
    tf($('s3b'),{c:false,x:0,y:690,s:1+.03*Math.sin(t*8)*(t>8.7?1:0)});
    document.querySelectorAll('.seat').forEach((s,i)=>{const q=E(t,9.0+i*.25,9.35+i*.25,'outBack');s.style.transform=`scale(${q}) rotate(${(1-q)*-30}deg)`;s.style.opacity=clamp(q*3)});
    tf($('s3seats'),{c:false,x:0,y:1050});
    const c=E(t,10.2,10.5,'outBack');tf($('s3c'),{c:false,x:0,y:1290,s:c,op:clamp(c*3)});$('s3c').style.transformOrigin='50% 50%';
    const ct=t-8.05;document.querySelectorAll('.cf').forEach(c=>{if(ct<0){c.style.opacity=0;return}
      tf(c,{x:540+(+c.dataset.vx)*ct*.8,y:800+(+c.dataset.vy)*ct*.8+1100*ct*ct,r:(+c.dataset.r)*ct,op:clamp(1-(ct-1.4)/.5)})});
    const ex=E(t,10.7,11.05,'inExpo');$('s3').style.transform=`translateY(${-ex*1900}px)`;
  }

  /* S4 11–18 */
  if(show('s4',t,10.95,18.05)){
    const rv=E(t,10.95,11.3,'inOutCubic');$('s4').style.clipPath=rv<1?`inset(${(1-rv)*100}% 0 0 0)`:'none';
    tf($('s4b1'),{x:250,y:700+Math.sin(t)*60});tf($('s4b2'),{x:850,y:1400+Math.cos(t)*60});
    tf($('s4lab'),{c:false,op:E(t,11.05,11.4)});animWords($('s4h'),t,11.1,.08,.55);
    document.querySelectorAll('.s4c').forEach((c,i)=>{const t0=11.6+i*1.5;const p=E(t,t0,t0+.55);
      tf(c,{x:540+(1-p)*(i%2?-1000:1000),y:760+i*400,r:(1-p)*(i%2?-5:5),op:clamp(p*2)});
      c.querySelector('.s4strike').style.transform=`scaleX(${E(t,t0+.45,t0+.75,'inOutCubic')})`;
      const np=E(t,t0+.75,t0+1.1,'outBack');const ne=c.querySelector('.s4new');ne.style.transform=`translateY(${(1-np)*60}px) scale(${lerp(1.5,1,np)})`;ne.style.opacity=clamp(np*3);
      const bd=E(t,t0+1.0,t0+1.25,'outBack');c.querySelector('.s4badge').style.transform=`scale(${bd}) rotate(${(1-bd)*-40}deg)`;
      c.style.boxShadow=`0 40px 100px rgba(0,0,0,.55),0 0 0 ${(t>t0+.75&&t<t0+1.5?1:0)*3}px rgba(255,200,61,.8)`;});
    const ex=E(t,17.6,18.05,'inExpo');$('s4').style.transform=`translateX(${-ex*1100}px)`;$('s4').style.filter=ex>.01?`blur(${ex*20}px)`:'none';
  }

  /* S5 18–21.5 */
  if(show('s5',t,17.95,21.55)){
    tf($('s5b1'),{x:540,y:1000});tf($('s5lab'),{c:false,op:E(t,18.0,18.4)});
    document.querySelectorAll('.s5i').forEach((el,i)=>{const t0=18.15+i*.5;const p=E(t,t0,t0+.45);
      tf(el,{c:false,x:72+(1-p)*900,y:500+i*300,op:clamp(p*2)})});
    const ex=E(t,21.1,21.55,'inExpo');$('s5').style.transform=`scale(${1-ex*.15})`;$('s5').style.opacity=1-ex;
  }

  /* S6 21.5–26 */
  if(show('s6',t,21.45,26.01)){
    tf($('s6b1'),{x:540+Math.sin(t)*100,y:700});tf($('s6b2'),{x:700,y:1400+Math.cos(t)*100});
    document.querySelectorAll('.rg').forEach((r,i)=>{const k=((t-21.5)/1.2+i/5)%1;tf(r,{x:540,y:640,s:1+k*2.6,op:t<21.55?0:(1-k)*.7})});
    const m=E(t,21.5,22.0,'outBack');tf($('s6mono'),{x:540,y:640,s:m,op:clamp(m*3)});$('s6ring').style.transform=`rotate(${t*120}deg)`;
    animWords($('s6a'),t,21.8,.08,.5);tf($('s6a'),{c:false,x:0,y:890});
    animWords($('s6b'),t,22.0,.08,.5);tf($('s6b'),{c:false,x:0,y:1020});
    const d=E(t,22.6,23.0,'outBack');tf($('s6dm'),{x:540,y:1320,s:d*(1+(t>23.2?.035*Math.sin((t-23.2)*7):0)),op:clamp(d*3)});
    $('s6at').querySelectorAll('.wi').forEach((w,i)=>{const p=E(t,23.2+i*.03,23.7+i*.03);w.style.transform=`translateY(${(1-p)*120}%)`});
    tf($('s6at'),{x:540,y:1530});
    $('s6left').textContent='● 5 places disponibles';tf($('s6left'),{x:540,y:1660,op:E(t,23.8,24.2)*(.6+.4*Math.abs(Math.sin(t*3)))});
  }
  document.querySelectorAll('.grad').forEach(g=>{if(g.dataset.done||!g.offsetWidth)return;const ws=g.querySelectorAll('.wi');if(!ws.length)return;
    ws.forEach(w=>{w.style.backgroundSize=g.offsetWidth+'px 100%';w.style.backgroundPosition=(-w.offsetLeft)+'px 0'});g.dataset.done=1});
  grain(frame);
}
window.render=render;
window.settle=()=>Promise.all([...document.images].filter(i=>i.getAttribute('src')&&!i.complete).map(i=>i.decode().catch(()=>{})));
window.ready=Promise.all([document.fonts.ready]);
</script>
</body>
