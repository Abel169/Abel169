.a{position:absolute;left:0;top:0;will-change:transform,opacity}

<script>
const $=id=>document.getElementById(id);
const clamp=(x,a=0,b=1)=>Math.min(b,Math.max(a,x));
const lerp=(a,b,t)=>a+(b-a)*t;
const seg=(t,a,b)=>clamp((t-a)/(b-a));
const EZ={lin:x=>x,outCubic:x=>1-Math.pow(1-x,3),inCubic:x=>x*x*x,inOutCubic:x=>x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2,
 inOutQuint:x=>x<.5?16*x**5:1-Math.pow(-2*x+2,5)/2,outExpo:x=>x>=1?1:1-Math.pow(2,-10*x),inExpo:x=>x<=0?0:Math.pow(2,10*x-10),
 outBack:x=>{const c1=1.9,c3=c1+1;return 1+c3*Math.pow(x-1,3)+c1*Math.pow(x-1,2)},
 outElastic:x=>x<=0?0:x>=1?1:Math.pow(2,-10*x)*Math.sin((x*10-.75)*(2*Math.PI/3))+1};
const E=(t,a,b,e='outExpo')=>EZ[e](seg(t,a,b));
function tf(el,o){const {x=0,y=0,s=1,sx,sy,r=0,ry=0,c=true,op,blur}=o;
  el.style.transform=`translate(${x}px,${y}px)${c?' translate(-50%,-50%)':''} rotateY(${ry}deg) rotate(${r}deg) scale(${sx??s},${sy??s})`;
  if(op!==undefined)el.style.opacity=op; if(blur!==undefined)el.style.filter=blur>0.05?`blur(${blur}px)`:'none';}
let seed=41;const rnd=()=>{seed=(seed*16807)%2147483647;return(seed-1)/2147483646};
function show(id,t,a,b){const v=t>=a&&t<b;$(id).style.display=v?'block':'none';return v}
const words=txt=>txt.split(' ').map(w=>`<span class="w"><span class="wi">${w}</span></span>`).join(' ');
function animW(el,t,t0,stag=.07,dur=.6,from=115,e='outExpo'){el.querySelectorAll('.wi').forEach((w,i)=>{const p=E(t,t0+i*stag,t0+i*stag+dur,e);w.style.transform=`translateY(${(1-p)*from}%) rotate(${(1-p)*5}deg)`})}
const tapAt=(el,t,t0,x,y)=>{const k=seg(t,t0,t0+.45);el.style.left=x+'px';el.style.top=y+'px';el.style.transform=`scale(${t<t0?0:t<t0+.12?lerp(.4,1,seg(t,t0,t0+.12)):1+k*.9})`;el.style.opacity=t<t0?0:(1-k)};

/* build */
$('s1a').innerHTML=words('Une envie');$('s1b').innerHTML=words('de douceur ?');
$('s2rings').innerHTML=Array.from({length:5},()=>'<div class="a rg" style="width:600px;height:600px;border-radius:50%;border:4px solid rgba(255,255,255,.55)"></div>').join('');
$('s2t').innerHTML=words('Le Goût de la Différence !');
$('s3h1').innerHTML=words('Toute la gourmandise');$('s3h2').innerHTML=words('dans votre poche.');
const TL=[['t_boissons','Boissons',1440,250,-8],['t_boulangerie','Boulangerie',1760,300,7],['t_viennoiseries','Viennoiseries',1450,760,6],['t_menus','Menus spéciaux',1770,800,-6],['t_plateaux','Plateaux',230,880,-5],['t_plats','Plats',560,900,6]];
$('s3tiles').innerHTML=TL.map(([p,n])=>`<div class="a tile s3t"><img src="assets/${p}.jpg"><div>${n}</div></div>`).join('');
const ST=['Choisis','Personnalise','Commande'];
$('s4steps').innerHTML=ST.map((s,i)=>`<div class="chip s4c" style="background:#fff;color:#461703;box-shadow:0 10px 24px rgba(70,23,3,.15)"><span class="n" style="width:42px;height:42px;border-radius:50%;background:#FFE0C8;color:#F65602;display:grid;place-items:center;font-size:24px">${i+1}</span>${s}</div>`).join('');
$('s5big').innerHTML=words('100 %');$('s5mai').innerHTML=words('fait maison.');
const ICO={cone:'<path d="M7 11l5 11 5-11"/><path d="M17 7A5 5 0 0 0 7 7"/><path d="M17 7a2 2 0 0 1 0 4H7a2 2 0 0 1 0-4"/>',
 cake:'<path d="M20 21v-8a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v8M4 16s.5-1 2-1 2.5 2 4 2 2.5-2 4-2 2.5 2 4 2 2-1 2-1M2 21h20M7 8v3M12 8v3M17 8v3M7 4h.01M12 4h.01M17 4h.01"/>',
 sand:'<path d="M3 11h18M4 11c0-4 3.6-7 8-7s8 3 8 7M5 15h14l-1 4H6z"/>',bread:'<path d="M6 21a3 3 0 0 1-3-3V9a6 6 0 0 1 6-6h6a6 6 0 0 1 6 6v9a3 3 0 0 1-3 3z"/><path d="M8 8l2 2M12 7l2 2M15 9l1 1"/>'};
const L5=[['cone','Glaces artisanales'],['cake','Gâteaux d’anniversaire'],['bread','Viennoiseries & boulangerie'],['sand','Crêpes salées & sandwichs']];

const SP=Array.from({length:100},()=>({x:rnd()*1920,y:rnd()*1080,v:40+rnd()*120,r:rnd()*6.28,vr:(rnd()-.5)*4,c:['#F2A6B4','#FDC844','#FFFFFF','#B3122E','#9ED8E6'][Math.floor(rnd()*5)],l:12+rnd()*14}));
const sx=$('sprinkles').getContext('2d');
function sprinkles(t,a){sx.clearRect(0,0,1920,1080);if(a<=0)return;sx.lineCap='round';
  for(const p of SP){const y=((p.y+t*p.v)%1160+1160)%1160-40;const r=p.r+t*p.vr;sx.strokeStyle=p.c;sx.globalAlpha=a*.85;sx.lineWidth=7;
    sx.beginPath();sx.moveTo(p.x-Math.cos(r)*p.l/2,y-Math.sin(r)*p.l/2);sx.lineTo(p.x+Math.cos(r)*p.l/2,y+Math.sin(r)*p.l/2);sx.stroke();}sx.globalAlpha=1;}
const gctx=$('grain').getContext('2d');const gimg=gctx.createImageData(640,360);
function grain(f){let s=(f*7919+13)%2147483647||1;const d=gimg.data;for(let i=0;i<d.length;i+=4){s=(s*16807)%2147483647;const v=s&255;d[i]=d[i+1]=d[i+2]=v;d[i+3]=255}gctx.putImageData(gimg,0,0)}

const SCR=488; // phone screen width in px
function render(t,frame){
  let shx=0,shy=0;for(const [st,a] of [[3.2,14],[6.6,8],[12.6,8],[18.2,3],[19.4,8],[23.4,8],[26.6,10]]){const k=seg(t,st,st+.35);if(k>0&&k<1){const m=a*(1-k)**2;shx+=Math.sin(t*95)*m;shy+=Math.cos(t*81)*m}}

  }
