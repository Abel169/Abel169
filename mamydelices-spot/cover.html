<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Mamy Délices · App</title>
<style>
@font-face{font-family:Mont;src:url(fonts/montserrat-latin-500-normal.woff2);font-weight:500}
@font-face{font-family:Mont;src:url(fonts/montserrat-latin-700-normal.woff2);font-weight:700}
@font-face{font-family:Mont;src:url(fonts/montserrat-latin-800-normal.woff2);font-weight:800}
@font-face{font-family:Mont;src:url(fonts/montserrat-latin-900-normal.woff2);font-weight:900}
@font-face{font-family:Cor;src:url(fonts/cormorant-garamond-latin-400-italic.woff2);font-weight:400;font-style:italic}
@font-face{font-family:Cor;src:url(fonts/cormorant-garamond-latin-600-italic.woff2);font-weight:600;font-style:italic}
:root{--o:#F65602;--o2:#FF8A1E;--y:#FDC844;--cr:#FFFAEC;--hd:#FFF2C6;--br:#461703;--rose:#F0284A;--pk:#F2A6B4;--red:#B3122E}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1080px;height:1920px;overflow:hidden;background:#000}
body{font-family:Mont,sans-serif;color:#fff}
#stage{position:absolute;inset:0;overflow:hidden;background:var(--o)}
#world{position:absolute;inset:0}
.scene{position:absolute;inset:0;overflow:hidden;display:none}
.a{position:absolute;left:0;top:0;will-change:transform,opacity}
.cor{font-family:Cor,serif;font-style:italic}
.w{display:inline-block;overflow:hidden;vertical-align:top;padding:0 .06em .18em;margin-bottom:-.18em}
.wi{display:inline-block;will-change:transform}
.h{font-weight:900;letter-spacing:-3px;line-height:1.02;white-space:nowrap}
.caps{font-weight:800;letter-spacing:8px;text-transform:uppercase;white-space:nowrap}
.orangebg{background:radial-gradient(ellipse at 50% 35%,#FF9A3C 0%,#F65602 50%,#C94100 100%)}
.waves{background-image:repeating-radial-gradient(circle at 20% 30%,rgba(255,255,255,.06) 0 3px,transparent 3px 40px)}
.phone{width:520px;height:1080px;border-radius:74px;background:#1a0d06;padding:16px;box-shadow:0 70px 140px rgba(70,23,3,.45),0 0 0 3px #3b2414 inset}
.phone .scr{position:relative;width:100%;height:100%;border-radius:58px;overflow:hidden;background:var(--cr)}
.phone .cam{position:absolute;left:50%;top:16px;width:24px;height:24px;margin-left:-12px;border-radius:50%;background:#1a0d06;z-index:20}
.tile{width:270px;border-radius:30px;overflow:hidden;background:#fff;box-shadow:0 30px 60px rgba(70,23,3,.35)}
.tile img{width:100%;display:block}
.tile div{font-family:Cor;font-style:italic;font-weight:600;font-size:36px;color:var(--br);text-align:center;padding:10px 0 14px}
.tap{position:absolute;width:70px;height:70px;margin:-35px;border-radius:50%;background:rgba(255,255,255,.75);border:4px solid rgba(70,23,3,.35);z-index:30}
.chip{display:flex;align-items:center;gap:14px;padding:16px 28px;border-radius:40px;font-weight:800;font-size:30px;white-space:nowrap}
#sig{position:absolute;left:0;width:1080px;top:1850px;text-align:center;font-weight:700;font-size:21px;letter-spacing:10px;z-index:40;pointer-events:none}
#grain{position:absolute;inset:0;width:1080px;height:1920px;mix-blend-mode:overlay;opacity:.06;pointer-events:none;z-index:35}
#flash{position:absolute;inset:0;background:#FFF6E0;opacity:0;pointer-events:none;z-index:36}
#sprinkles{position:absolute;inset:0;width:1080px;height:1920px;pointer-events:none;z-index:34}
svg.ic{fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
</style>
</head>
<body>
<div id="stage" class="orangebg">
  <div class="a waves" style="width:1080px;height:1920px"></div>
  <div class="a" style="width:2800px;height:2800px;left:-860px;top:-500px;border-radius:50%;background:repeating-conic-gradient(from 0deg,rgba(255,255,255,.08) 0deg 6deg,transparent 6deg 18deg);-webkit-mask-image:radial-gradient(circle,#000 10%,transparent 60%)"></div>
  <div class="a" style="left:420px;top:262px;width:240px;height:240px;border-radius:50%;box-shadow:0 0 0 12px rgba(255,255,255,.3),0 20px 50px rgba(120,30,0,.4)"><img src="assets/logo_disc.png" style="width:100%;height:100%;display:block"></div>
  <div class="a cor" style="width:1080px;text-align:center;top:520px;font-weight:600;font-size:84px;color:#FFF6E0">Une envie de douceur ?</div>
  <div class="a h" style="width:1080px;text-align:center;top:625px;font-size:96px;text-shadow:0 8px 0 rgba(150,40,0,.35)">Il y a une appli !</div>
  <div class="a" style="left:310px;top:790px;transform:scale(.8);transform-origin:50% 0"><div class="phone"><div class="scr"><div class="cam"></div><img src="assets/s_home.jpg" style="width:100%;display:block"></div></div></div>
  <div class="a tile" style="left:40px;top:900px;transform:rotate(-8deg) scale(.9)"><img src="assets/t_boissons.jpg"><div>Boissons</div></div>
  <div class="a tile" style="left:770px;top:930px;transform:rotate(7deg) scale(.9)"><img src="assets/t_viennoiseries.jpg"><div>Viennoiseries</div></div>
  <div class="a tile" style="left:60px;top:1300px;transform:rotate(6deg) scale(.85)"><img src="assets/t_menus.jpg"><div>Menus spéciaux</div></div>
  <div class="a tile" style="left:760px;top:1320px;transform:rotate(-6deg) scale(.85)"><img src="assets/t_plats.jpg"><div>Plats</div></div>
  <div class="a" style="left:0;width:1080px;top:1846px;text-align:center;font-weight:700;font-size:21px;letter-spacing:10px;color:rgba(255,255,255,.7)">SOGOBA CRÉATIVE</div>
</div>
<script>window.ready=Promise.all([document.fonts.ready,...[...document.images].map(i=>i.decode().catch(()=>{}))]);</script></body></html>
