<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>IBA Design · Le Fil d'Or</title>
<style>
@font-face{font-family:Outfit;src:url(fonts/outfit-latin-400-normal.woff2);font-weight:400}
@font-face{font-family:Outfit;src:url(fonts/outfit-latin-600-normal.woff2);font-weight:600}
@font-face{font-family:Play;src:url(fonts/playfair-display-latin-500-italic.woff2);font-weight:500;font-style:italic}
@font-face{font-family:Play;src:url(fonts/playfair-display-latin-700-italic.woff2);font-weight:700;font-style:italic}
:root{--bg:#0B0806;--or:#D4A64A;--or2:#F3D58A;--cu:#B8734A;--cr:#F4EBDD;--terra:#A65A3A;--rose:#E8B4B0;
 --gold:linear-gradient(100deg,#9C7428 0%,#F3D58A 35%,#D4A64A 55%,#FFF1C7 70%,#B8873A 100%)}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1080px;height:1920px;overflow:hidden;background:#000}
body{font-family:Outfit,sans-serif;color:var(--cr)}
#stage{position:absolute;inset:0;overflow:hidden;background:var(--bg)}
#world{position:absolute;inset:0}
.scene{position:absolute;inset:0;overflow:hidden;display:none}
.a{position:absolute;left:0;top:0;will-change:transform,opacity}
.pf{font-family:Play,serif;font-style:italic;font-weight:500}
.caps{font-family:Outfit;font-weight:600;letter-spacing:12px;text-transform:uppercase}
.goldtxt{background:var(--gold);-webkit-background-clip:text;background-clip:text;color:transparent}
.arch{position:absolute;left:0;top:0}
.arch .ph{position:absolute;inset:0;overflow:hidden}
.arch .ph img{position:absolute;left:0;top:0;width:100%;height:100%;object-fit:cover;will-change:transform}
.arch .veil{position:absolute;left:-10%;width:120%;height:130%;top:-15%;background:linear-gradient(180deg,rgba(244,235,221,.0) 0%,rgba(244,235,221,.92) 18%,#EBDCC4 60%,rgba(212,166,74,.95) 100%)}
.arch svg.ol{position:absolute;inset:-10px;overflow:visible}
.lbl{white-space:nowrap;text-align:center}
#grain{position:absolute;inset:0;width:1080px;height:1920px;mix-blend-mode:overlay;opacity:.07;pointer-events:none}
#vig{position:absolute;inset:0;background:radial-gradient(ellipse at center,rgba(0,0,0,0) 50%,rgba(0,0,0,.55) 100%);pointer-events:none}
#flash{position:absolute;inset:0;background:#FFF3D6;opacity:0;pointer-events:none}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute"><defs><linearGradient id="gth" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#9C7428"/><stop offset=".5" stop-color="#FFF1C7"/><stop offset="1" stop-color="#D4A64A"/></linearGradient></defs></svg>
<div id="stage" style="background:radial-gradient(ellipse at 50% 45%,#3a2516 0%,#140d08 55%,#070403 100%)">
  <img class="a" src="photos/d_blanc_or.jpg" style="width:1300px;height:2310px;left:-110px;top:-195px;object-fit:cover;filter:blur(70px) brightness(.32) saturate(1.2)">
  <div class="a" id="logo" style="width:560px;left:260px;top:262px"></div>
  <div id="arch"></div>
  <div class="a lbl pf" style="width:1080px;top:1505px;font-size:60px;color:var(--cr)">Quand l'élégance</div>
  <div class="a lbl pf goldtxt" style="width:1080px;top:1580px;font-size:68px;font-weight:700;padding-bottom:8px">devient une signature</div>
  <div class="a caps lbl" style="width:1080px;top:1760px;font-size:26px;color:rgba(244,235,221,.75)">Prêt-à-porter féminin · Bamako</div>
  <div id="dust"></div>
</div>
<div id="vig"></div>
<script>
const $=id=>document.getElementById(id);
const clamp=(x,a=0,b=1)=>Math.min(b,Math.max(a,x));
const lerp=(a,b,t)=>a+(b-a)*t;
const seg=(t,a,b)=>clamp((t-a)/(b-a));
const EZ={lin:x=>x,outCubic:x=>1-Math.pow(1-x,3),inOutCubic:x=>x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2,inOutSine:x=>-(Math.cos(Math.PI*x)-1)/2,
 outExpo:x=>x>=1?1:1-Math.pow(2,-10*x),inExpo:x=>x<=0?0:Math.pow(2,10*x-10),outQuart:x=>1-Math.pow(1-x,4),
 outBack:x=>{const c1=1.4,c3=c1+1;return 1+c3*Math.pow(x-1,3)+c1*Math.pow(x-1,2)}};
const E=(t,a,b,e='outCubic')=>EZ[e](seg(t,a,b));
function tf(el,o){const {x=0,y=0,s=1,r=0,ry=0,c=true,op,blur}=o;
  el.style.transform=`translate(${x}px,${y}px)${c?' translate(-50%,-50%)':''} rotateY(${ry}deg) rotate(${r}deg) scale(${s})`;
  if(op!==undefined)el.style.opacity=op; if(blur!==undefined)el.style.filter=blur>0.05?`blur(${blur}px)`:'none';}
let seed=77;const rnd=()=>{seed=(seed*16807)%2147483647;return(seed-1)/2147483646};
function show(id,t,a,b){const v=t>=a&&t<b;$(id).style.display=v?'block':'none';return v}

/* ---------- logo (vector rebuild of the IBA Design sign) ---------- */
let LID=0;
function logoSVG(bg){const g='lg'+(LID++);
 return `<svg viewBox="0 0 1300 420" style="width:100%;display:block;overflow:visible">
 <defs><linearGradient id="${g}" x1="0" y1="0" x2="1" y2=".3"><stop offset="0" stop-color="#A57B2E"/><stop offset=".35" stop-color="#F3D58A"/><stop offset=".55" stop-color="#D4A64A"/><stop offset=".72" stop-color="#FFF1C7"/><stop offset="1" stop-color="#B8873A"/></linearGradient></defs>
 <circle class="lc" cx="215" cy="262" r="116" fill="none" stroke="url(#${g})" stroke-width="7" pathLength="1" transform="rotate(-90 215 262)"/>
 <g class="lm" fill="url(#${g})" style="transform-box:fill-box;transform-origin:50% 50%">
  <polygon points="146,196 178,186 178,210 146,218"/><rect x="150" y="226" width="26" height="110"/>
  <path d="M190 190 H238 A73 73 0 0 1 238 336 H190 Z M216 214 V312 H236 A49 49 0 0 0 236 214 Z" fill-rule="evenodd"/>
  <polygon points="186,340 186,292 216,256 216,340" fill="${bg}"/></g>
 <g class="lw" fill="url(#${g})">
  <rect x="383" y="168" width="15" height="134"/>
  <path d="M420 168 H468 A32 32 0 0 1 468 232 H420 Z M434 180 V220 H466 A20 20 0 0 0 466 180 Z M420 232 H472 A35 35 0 0 1 472 302 H420 Z M434 244 V290 H470 A23 23 0 0 0 470 244 Z" fill-rule="evenodd"/>
  <polygon points="560,168 576,168 630,302 614,302 568,186 522,302 506,302"/><rect x="560" y="262" width="34" height="13"/>
  <path d="M716 168 H752 A67 67 0 0 1 752 302 H698 V214 H712 V289 H750 A54 54 0 0 0 750 181 H716 Z"/>
  <rect x="822" y="168" width="74" height="14"/><rect x="822" y="228" width="74" height="14"/><rect x="822" y="288" width="74" height="14"/>
  <text x="905" y="302" font-family="Outfit" font-weight="400" font-size="186" textLength="395" lengthAdjust="spacingAndGlyphs">SIGN</text></g>
 <text class="lt" x="380" y="372" fill="url(#${g})" font-family="Outfit" font-weight="400" font-size="62" textLength="912" lengthAdjust="spacing">PRET A PORTER</text>
 </svg>`;}
function animLogo(root,t,t0,sp=1){
  const c=root.querySelector('.lc');c.style.strokeDasharray='1 1';c.style.strokeDashoffset=1-E(t,t0,t0+.9*sp,'inOutCubic');
  const m=E(t,t0+.7*sp,t0+1.1*sp,'outBack');const lm=root.querySelector('.lm');lm.style.transform=`scale(${.6+.4*m})`;lm.style.opacity=clamp(m*1.5);
  const w=E(t,t0+.95*sp,t0+1.6*sp,'inOutCubic');root.querySelector('.lw').style.clipPath=`inset(0 ${(1-w)*100}% 0 0)`;
  const tl=root.querySelector('.lt');const tp=E(t,t0+1.4*sp,t0+2.0*sp);tl.style.opacity=tp;tl.setAttribute('textLength',lerp(700,912,tp));
}

/* ---------- arches ---------- */
const archPath=(w,h)=>{const r=w/2;return `M0,${h} V${r} A${r},${r} 0 0 1 ${w},${r} V${h} Z`};
function archHTML(id,w,h,src,pos='center'){return `<div class="arch" id="${id}" style="width:${w}px;height:${h}px">
  <div class="ph" style="clip-path:path('${archPath(w,h)}')"><img src="${src}" style="object-position:${pos}"><div class="veil"></div></div>
  <svg class="ol" width="${w+20}" height="${h+20}" viewBox="-10 -10 ${w+20} ${h+20}"><path d="${archPath(w,h)}" fill="none" stroke="url(#gth)" stroke-width="5" pathLength="1" style="filter:drop-shadow(0 0 8px rgba(243,213,138,.7))"/></svg></div>`}
function animArch(el,t,t0,dur=1.5,{x=540,y=1000,zoom=.08}={}){
  const ol=el.querySelector('svg.ol path');ol.style.strokeDasharray='1 1';ol.style.strokeDashoffset=1-E(t,t0,t0+.55,'inOutCubic');
  const v=E(t,t0+.25,t0+.85,'inOutCubic');el.querySelector('.veil').style.transform=`translateY(${-v*120}%) skewY(${-8*(1-v)}deg)`;
  el.querySelector('.ph').style.opacity=clamp((t-t0+.05)/.15);
  const kb=seg(t,t0,t0+dur+.6);el.querySelector('img').style.transform=`scale(${1+zoom-kb*zoom})`;
}


document.getElementById('logo').innerHTML=logoSVG('#140d08');
document.getElementById('arch').innerHTML=archHTML('ac',740,1040,'photos/d_blanc_or.jpg','50% 40%');
const a=document.getElementById('ac');a.style.left='170px';a.style.top='470px';
a.querySelector('.veil').style.display='none';
const ol=a.querySelector('svg.ol path');ol.style.strokeDasharray='none';
let h='';for(let i=0;i<45;i++){const sz=2+rnd()*5;h+=`<div class="a" style="left:${rnd()*1080}px;top:${rnd()*1920}px;width:${sz}px;height:${sz}px;border-radius:50%;background:#F3D58A;opacity:${.2+rnd()*.5};box-shadow:0 0 ${sz*3}px #D4A64A"></div>`}
document.getElementById('dust').innerHTML=h;
window.ready=Promise.all([document.fonts.ready,...[...document.images].map(i=>i.decode().catch(()=>{}))]);
</script></body></html>
