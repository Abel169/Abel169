<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>IBA Design · Le Fil d'Or</title>
<style>
@font-face{font-family:Outfit;src:url(fonts/outfit-latin-400-normal.woff2);font-weight:400}
@font-face{font-family:Outfit;src:url(fonts/outfit-latin-600-normal.woff2);font-weight:600}
@font-face{font-family:Play;src:url(fonts/playfair-display-latin-500-italic.woff2);font-weight:500;font-style:italic}
@font-face{font-family:Play;src:url(fonts/playfair-display-latin-700-italic.woff2);font-weight:700;font-style:italic}
:root{--bg:#0B0806;--or:#D4A64A;--or2:#F3D58A;--cu:#B8734A;--cr:#F4EBDD;--terra:#A65A3A;--rose:#E8B4B0;
 --gold:linear-gradient(100deg,#9C7428 0%,#F3D58A 35%,#D4A64A 55%,#FFF1C7 70%,#B8873A 100%)}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1080px;height:1920px;overflow:hidden;background:#000}
body{font-family:Outfit,sans-serif;color:var(--cr)}
#stage{position:absolute;inset:0;overflow:hidden;background:var(--bg)}
#world{position:absolute;inset:0}
.scene{position:absolute;inset:0;overflow:hidden;display:none}
.a{position:absolute;left:0;top:0;will-change:transform,opacity}
.pf{font-family:Play,serif;font-style:italic;font-weight:500}
.caps{font-family:Outfit;font-weight:600;letter-spacing:12px;text-transform:uppercase}
.goldtxt{background:var(--gold);-webkit-background-clip:text;background-clip:text;color:transparent}
.arch{position:absolute;left:0;top:0}
.arch .ph{position:absolute;inset:0;overflow:hidden}
.arch .ph img{position:absolute;left:0;top:0;width:100%;height:100%;object-fit:cover;will-change:transform}
.arch .veil{position:absolute;left:-10%;width:120%;height:130%;top:-15%;background:linear-gradient(180deg,rgba(244,235,221,.0) 0%,rgba(244,235,221,.92) 18%,#EBDCC4 60%,rgba(212,166,74,.95) 100%)}
.arch svg.ol{position:absolute;inset:-10px;overflow:visible}
.lbl{white-space:nowrap;text-align:center}
#grain{position:absolute;inset:0;width:1080px;height:1920px;mix-blend-mode:overlay;opacity:.07;pointer-events:none}
#vig{position:absolute;inset:0;background:radial-gradient(ellipse at center,rgba(0,0,0,0) 50%,rgba(0,0,0,.55) 100%);pointer-events:none}
#flash{position:absolute;inset:0;background:#FFF3D6;opacity:0;pointer-events:none}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute"><defs><linearGradient id="gth" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#9C7428"/><stop offset=".5" stop-color="#FFF1C7"/><stop offset="1" stop-color="#D4A64A"/></linearGradient></defs></svg>
<div id="stage"><div id="world">

<div id="dust" class="a" style="width:1080px;height:1920px;z-index:5;pointer-events:none"></div>

<!-- S1 LOGO 0–3 -->
<div class="scene" id="s1" style="background:radial-gradient(ellipse at 50% 45%,#2a1d10 0%,#0B0806 60%,#050302 100%)">
  <svg class="a" id="s1thread" width="1080" height="1920" viewBox="0 0 1080 1920" style="overflow:visible">
    
    <path id="thr1" d="M-60 1650 C 200 1500, 120 1250, 330 1180 S 620 1150, 520 980 S 300 760, 470 700" fill="none" stroke="url(#gth)" stroke-width="5" stroke-linecap="round" pathLength="1" style="filter:drop-shadow(0 0 10px rgba(243,213,138,.8))"/>
  </svg>
  <div class="a" id="s1logo" style="width:980px"></div>
  <div class="a" id="s1shine" style="width:980px;height:340px;overflow:hidden;mix-blend-mode:screen"><div id="s1band" style="position:absolute;top:-50%;width:180px;height:200%;background:linear-gradient(90deg,transparent,rgba(255,250,230,.85),transparent);transform:rotate(20deg)"></div></div>
</div>

<!-- S2 SIGNATURE 3–6 -->
<div class="scene" id="s2">
  <img class="a" id="s2bg" src="photos/d_blanc_or.jpg" style="width:1300px;height:2310px;object-fit:cover;filter:blur(60px) brightness(.35) saturate(1.2)">
  <div id="s2arch"></div>
  <div class="a lbl pf" id="s2t1" style="width:1080px;font-size:64px;color:var(--cr)">Quand l'élégance</div>
  <div class="a lbl pf goldtxt" id="s2t2" style="width:1080px;font-size:72px;font-weight:700;padding-bottom:8px">devient une signature</div>
</div>

<!-- S3 DEFILE 6–15 -->
<div class="scene" id="s3">
  <img class="a" id="s3bg" style="width:1300px;height:2310px;object-fit:cover;filter:blur(60px) brightness(.32) saturate(1.2)">
  <div id="s3arches"></div>
  <div class="a caps goldtxt lbl" id="s3cap" style="width:1080px;font-size:40px"></div>
  <div class="a pf lbl" id="s3sub" style="width:1080px;font-size:48px;color:var(--cr)"></div>
  <div class="a" id="s3cnt" style="left:840px;top:330px;font-family:Outfit;font-weight:600;font-size:30px;letter-spacing:4px;color:rgba(243,213,138,.85)"></div>
</div>

<!-- S4 BOUTIQUE 15–19 -->
<div class="scene" id="s4">
  <img class="a" id="s4img" src="photos/m_noir_fleurs.jpg" style="width:1080px;height:2200px;object-fit:cover">
  <div class="a" style="width:1080px;height:1920px;background:linear-gradient(180deg,rgba(11,8,6,.55) 0%,rgba(11,8,6,0) 30%,rgba(11,8,6,0) 60%,rgba(11,8,6,.85) 100%)"></div>
  <div class="a" id="s4dim" style="width:1080px;height:1920px;background:#0B0806"></div>
  <div class="a lamp" id="s4l1" style="width:420px;height:420px;border-radius:50%;background:radial-gradient(circle,rgba(255,200,120,.95) 0%,rgba(255,160,70,.45) 20%,rgba(255,140,60,0) 60%);mix-blend-mode:screen"></div>
  <div class="a lamp" id="s4l2" style="width:420px;height:420px;border-radius:50%;background:radial-gradient(circle,rgba(255,200,120,.95) 0%,rgba(255,160,70,.45) 20%,rgba(255,140,60,0) 60%);mix-blend-mode:screen"></div>
  <div class="a caps goldtxt lbl" id="s4cap" style="width:1080px;font-size:36px">La boutique</div>
  <div class="a pf lbl" id="s4t" style="width:1080px;font-size:66px;color:var(--cr)">Hamdallaye ACI 2000</div>
  <div class="a" id="s4duo" style="width:1080px;height:1920px"></div>
</div>

<!-- S5 DUOS 19–22 -->
<div class="scene" id="s5">
  <div class="a" style="width:1080px;height:1920px;background:radial-gradient(ellipse at 50% 40%,#3a2516 0%,#140d08 60%,#070403 100%)"></div>
  <div id="s5arches"></div>
  <div class="a lbl" id="s5stars" style="width:1080px;display:flex;justify-content:center;gap:18px"></div>
  <div class="a pf lbl" id="s5t" style="width:1080px;font-size:62px;color:var(--cr)">Recommandé par <span class="goldtxt" style="font-weight:700">90 %</span></div>
  <div class="a caps lbl" id="s5s" style="width:1080px;font-size:26px;color:rgba(244,235,221,.75)">de nos clientes · 102 avis</div>
</div>

<!-- S6 OUTRO 22–25 -->
<div class="scene" id="s6" style="background:radial-gradient(ellipse at 50% 42%,#2a1d10 0%,#0B0806 60%,#050302 100%)">
  <svg class="a" id="s6ring" width="1080" height="1920" viewBox="0 0 1080 1920" style="overflow:visible">
    <ellipse cx="540" cy="760" rx="505" ry="310" fill="none" stroke="url(#gth)" stroke-width="4" pathLength="1" style="filter:drop-shadow(0 0 10px rgba(243,213,138,.7))"/>
  </svg>
  <div class="a" id="s6logo" style="width:900px"></div>
  <div class="a pf lbl" id="s6t" style="width:1080px;font-size:58px;color:var(--cr)">Prêt-à-porter féminin · Bamako</div>
  <div class="a lbl" id="s6tel" style="display:flex;align-items:center;gap:20px;font-family:Outfit;font-weight:600;font-size:64px;letter-spacing:3px;white-space:nowrap">
    <svg width="58" height="58" viewBox="0 0 24 24" fill="none" stroke="#F3D58A" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1.9.4 1.8.7 2.7a2 2 0 0 1-.5 2.1L8 9.8a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.4c.9.3 1.8.6 2.7.7a2 2 0 0 1 1.7 2z"/></svg>
    <span class="goldtxt">77 77 43 43</span></div>
  <div class="a lbl" id="s6adr" style="display:flex;align-items:center;gap:14px;font-family:Outfit;font-size:34px;color:rgba(244,235,221,.85);white-space:nowrap">
    <svg width="38" height="38" viewBox="0 0 24 24" fill="none" stroke="#F3D58A" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20 10c0 5-5.5 10.2-7.4 11.8a1 1 0 0 1-1.2 0C9.5 20.2 4 15 4 10a8 8 0 0 1 16 0"/><circle cx="12" cy="10" r="3"/></svg>
    Hamdallaye ACI 2000, rue 390</div>
</div>

<!-- persistent small header logo -->
<div class="a" id="hdr" style="width:430px;z-index:6"></div>

</div>
<div id="flash"></div>
<div id="vig"></div>
<canvas id="grain" width="360" height="640"></canvas>
</div>

<script>
const $=id=>document.getElementById(id);
const clamp=(x,a=0,b=1)=>Math.min(b,Math.max(a,x));
const lerp=(a,b,t)=>a+(b-a)*t;
const seg=(t,a,b)=>clamp((t-a)/(b-a));
const EZ={lin:x=>x,outCubic:x=>1-Math.pow(1-x,3),inOutCubic:x=>x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2,inOutSine:x=>-(Math.cos(Math.PI*x)-1)/2,
 outExpo:x=>x>=1?1:1-Math.pow(2,-10*x),inExpo:x=>x<=0?0:Math.pow(2,10*x-10),outQuart:x=>1-Math.pow(1-x,4),
 outBack:x=>{const c1=1.4,c3=c1+1;return 1+c3*Math.pow(x-1,3)+c1*Math.pow(x-1,2)}};
const E=(t,a,b,e='outCubic')=>EZ[e](seg(t,a,b));
function tf(el,o){const {x=0,y=0,s=1,r=0,ry=0,c=true,op,blur}=o;
  el.style.transform=`translate(${x}px,${y}px)${c?' translate(-50%,-50%)':''} rotateY(${ry}deg) rotate(${r}deg) scale(${s})`;
  if(op!==undefined)el.style.opacity=op; if(blur!==undefined)el.style.filter=blur>0.05?`blur(${blur}px)`:'none';}
let seed=77;const rnd=()=>{seed=(seed*16807)%2147483647;return(seed-1)/2147483646};
function show(id,t,a,b){const v=t>=a&&t<b;$(id).style.display=v?'block':'none';return v}

/* ---------- logo (vector rebuild of the IBA Design sign) ---------- */
let LID=0;
function logoSVG(bg){const g='lg'+(LID++);
 return `<svg viewBox="0 0 1300 420" style="width:100%;display:block;overflow:visible">
 <defs><linearGradient id="${g}" x1="0" y1="0" x2="1" y2=".3"><stop offset="0" stop-color="#A57B2E"/><stop offset=".35" stop-color="#F3D58A"/><stop offset=".55" stop-color="#D4A64A"/><stop offset=".72" stop-color="#FFF1C7"/><stop offset="1" stop-color="#B8873A"/></linearGradient></defs>
 <circle class="lc" cx="215" cy="262" r="116" fill="none" stroke="url(#${g})" stroke-width="7" pathLength="1" transform="rotate(-90 215 262)"/>
 <g class="lm" fill="url(#${g})" style="transform-box:fill-box;transform-origin:50% 50%">
  <polygon points="146,196 178,186 178,210 146,218"/><rect x="150" y="226" width="26" height="110"/>
  <path d="M190 190 H238 A73 73 0 0 1 238 336 H190 Z M216 214 V312 H236 A49 49 0 0 0 236 214 Z" fill-rule="evenodd"/>
  <polygon points="186,340 186,292 216,256 216,340" fill="${bg}"/></g>
 <g class="lw" fill="url(#${g})">
  <rect x="383" y="168" width="15" height="134"/>
  <path d="M420 168 H468 A32 32 0 0 1 468 232 H420 Z M434 180 V220 H466 A20 20 0 0 0 466 180 Z M420 232 H472 A35 35 0 0 1 472 302 H420 Z M434 244 V290 H470 A23 23 0 0 0 470 244 Z" fill-rule="evenodd"/>
  <polygon points="560,168 576,168 630,302 614,302 568,186 522,302 506,302"/><rect x="560" y="262" width="34" height="13"/>
  <path d="M716 168 H752 A67 67 0 0 1 752 302 H698 V214 H712 V289 H750 A54 54 0 0 0 750 181 H716 Z"/>
  <rect x="822" y="168" width="74" height="14"/><rect x="822" y="228" width="74" height="14"/><rect x="822" y="288" width="74" height="14"/>
  <text x="905" y="302" font-family="Outfit" font-weight="400" font-size="186" textLength="395" lengthAdjust="spacingAndGlyphs">SIGN</text></g>
 <text class="lt" x="380" y="372" fill="url(#${g})" font-family="Outfit" font-weight="400" font-size="62" textLength="912" lengthAdjust="spacing">PRET A PORTER</text>
 </svg>`;}
function animLogo(root,t,t0,sp=1){
  const c=root.querySelector('.lc');c.style.strokeDasharray='1 1';c.style.strokeDashoffset=1-E(t,t0,t0+.9*sp,'inOutCubic');
  const m=E(t,t0+.7*sp,t0+1.1*sp,'outBack');const lm=root.querySelector('.lm');lm.style.transform=`scale(${.6+.4*m})`;lm.style.opacity=clamp(m*1.5);
  const w=E(t,t0+.95*sp,t0+1.6*sp,'inOutCubic');root.querySelector('.lw').style.clipPath=`inset(0 ${(1-w)*100}% 0 0)`;
  const tl=root.querySelector('.lt');const tp=E(t,t0+1.4*sp,t0+2.0*sp);tl.style.opacity=tp;tl.setAttribute('textLength',lerp(700,912,tp));
}

/* ---------- arches ---------- */
const archPath=(w,h)=>{const r=w/2;return `M0,${h} V${r} A${r},${r} 0 0 1 ${w},${r} V${h} Z`};
function archHTML(id,w,h,src,pos='center'){return `<div class="arch" id="${id}" style="width:${w}px;height:${h}px">
  <div class="ph" style="clip-path:path('${archPath(w,h)}')"><img src="${src}" style="object-position:${pos}"><div class="veil"></div></div>
  <svg class="ol" width="${w+20}" height="${h+20}" viewBox="-10 -10 ${w+20} ${h+20}"><path d="${archPath(w,h)}" fill="none" stroke="url(#gth)" stroke-width="5" pathLength="1" style="filter:drop-shadow(0 0 8px rgba(243,213,138,.7))"/></svg></div>`}
function animArch(el,t,t0,dur=1.5,{x=540,y=1000,zoom=.08}={}){
  const ol=el.querySelector('svg.ol path');ol.style.strokeDasharray='1 1';ol.style.strokeDashoffset=1-E(t,t0,t0+.55,'inOutCubic');
  const v=E(t,t0+.25,t0+.85,'inOutCubic');el.querySelector('.veil').style.transform=`translateY(${-v*120}%) skewY(${-8*(1-v)}deg)`;
  el.querySelector('.ph').style.opacity=clamp((t-t0+.05)/.15);
  const kb=seg(t,t0,t0+dur+.6);el.querySelector('img').style.transform=`scale(${1+zoom-kb*zoom})`;
}

/* ---------- build ---------- */
$('s1logo').innerHTML=logoSVG('#0B0806');$('s6logo').innerHTML=logoSVG('#0B0806');$('hdr').innerHTML=logoSVG('rgba(0,0,0,0)');
$('s2arch').innerHTML=archHTML('a2',860,1260,'photos/d_blanc_or.jpg','50% 40%');
const DEF=[['p_noir_or','IBA DESIGN','Noir & or'],['p_moutarde','ABAYA VIP','Moutarde'],['p_blanche','IBA DESIGN','Blanc pur'],
 ['p_bleue','ABAYA VIP','Bleu ciel'],['p_vip_noire','ABAYA VIP','Brodée main'],['p_marine_fleurs','ABAYA VIP','Une véritable signature']];
$('s3arches').innerHTML=DEF.map(([p],i)=>archHTML('a3_'+i,780,1220,`photos/${p}.jpg`,'50% 30%')).join('');
$('s4duo').innerHTML=archHTML('a4_0',490,880,'photos/m_rose_bijoux.jpg','50% 40%')+archHTML('a4_1',490,880,'photos/m_beige.jpg','50% 50%')
 +`<div class="a caps goldtxt lbl" id="s4n0" style="width:500px;font-size:30px">Abaya Bijoux</div><div class="a caps goldtxt lbl" id="s4n1" style="width:500px;font-size:30px">Abaya Bibi</div>`;
$('s5arches').innerHTML=archHTML('a5_0',560,900,'photos/d_satin.jpg','50% 40%')+archHTML('a5_1',560,900,'photos/d_brodee.jpg','50% 40%');
$('s5stars').innerHTML=Array.from({length:5},()=>`<svg class="st" width="74" height="74" viewBox="0 0 24 24"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01z" fill="url(#gth)" stroke="#F3D58A" stroke-width=".6"/></svg>`).join('');
$('dust').innerHTML=Array.from({length:55},()=>{const s=2+rnd()*5;return `<div class="a pd" data-x="${rnd()*1080}" data-y="${rnd()*1920}" data-v="${10+rnd()*40}" data-ph="${rnd()*6.28}" style="width:${s}px;height:${s}px;border-radius:50%;background:#F3D58A;box-shadow:0 0 ${s*3}px #D4A64A"></div>`}).join('');

const gctx=$('grain').getContext('2d');const gimg=gctx.createImageData(360,640);
function grain(f){let s=(f*7919+13)%2147483647||1;const d=gimg.data;for(let i=0;i<d.length;i+=4){s=(s*16807)%2147483647;const v=s&255;d[i]=d[i+1]=d[i+2]=v;d[i+3]=255}gctx.putImageData(gimg,0,0)}

function render(t,frame){
  let fl=0;for(const [st,a] of [[1.6,.18],[6.0,.15],[15.0,.12],[22.0,.2]]){const k=seg(t,st,st+.6);if(t>=st&&k<1)fl=Math.max(fl,a*(1-EZ.outCubic(k)))}
  $('flash').style.opacity=fl;
  document.querySelectorAll('.pd').forEach(p=>{const x=+p.dataset.x,y=+p.dataset.y,v=+p.dataset.v,ph=+p.dataset.ph;const yy=((y-t*v)%1920+1920)%1920;
    tf(p,{x:x+Math.sin(t*.7+ph)*25,y:yy,op:(.15+.5*(.5+.5*Math.sin(t*2+ph)))*(t<24.6?1:1-seg(t,24.6,25))})});
  // header logo (3–22)
  const hv=t>=3.0&&t<22.0;$('hdr').style.display=hv?'block':'none';
  if(hv)tf($('hdr'),{x:540,y:180,op:E(t,3.0,3.5)*(1-E(t,21.6,22.0)),s:1});

  /* S1 0–3 */
  if(show('s1',t,0,3.05)){
    const th=$('thr1');th.style.strokeDasharray='1 1';th.style.strokeDashoffset=1-E(t,0,1.0,'inOutSine');th.style.opacity=1-E(t,1.3,1.8,'lin');
    animLogo($('s1logo'),t,.55,1);
    const out=E(t,2.55,3.05,'inOutCubic');
    tf($('s1logo'),{x:540,y:lerp(820,180,out),s:lerp(1,430/980,out)*(1+.015*Math.sin(t*2))});
    const sh=seg(t,1.9,2.6);tf($('s1shine'),{x:540,y:820,op:out<.01?1:0});$('s1band').style.left=lerp(-25,115,EZ.inOutSine(sh))+'%';
  }

  /* S2 3–6 */
  if(show('s2',t,2.95,6.1)){
    $('s2').style.opacity=E(t,2.95,3.25,'lin');
    tf($('s2bg'),{x:540,y:960});
    const a=$('a2');animArch(a,t,3.05,3);tf(a,{x:540,y:1000,s:1+.02*seg(t,3,6)});
    const p1=E(t,4.0,4.8),p2=E(t,4.4,5.2);
    tf($('s2t1'),{c:false,x:0,y:1680+(1-p1)*30,op:p1,blur:(1-p1)*8});tf($('s2t2'),{c:false,x:0,y:1760+(1-p2)*30,op:p2,blur:(1-p2)*8});
    const ex=E(t,5.7,6.1,'inOutCubic');a.style.opacity=1-ex;$('s2t1').style.opacity=p1*(1-ex);$('s2t2').style.opacity=p2*(1-ex);
  }

  /* S3 6–15 : 6 arches × 1.5 s */
  if(show('s3',t,5.9,15.1)){
    $('s3').style.opacity=E(t,5.9,6.2,'lin');
    const i=clamp(Math.floor((t-6)/1.5),0,5);const t0=6+i*1.5;
    $('s3bg').src!==undefined&&($('s3bg').getAttribute('src')!==`photos/${DEF[i][0]}.jpg`)&&$('s3bg').setAttribute('src',`photos/${DEF[i][0]}.jpg`);
    tf($('s3bg'),{x:540,y:960});
    document.querySelectorAll('#s3arches .arch').forEach((el,k)=>{const tk=6+k*1.5;
      if(t>=tk-.05&&t<tk+1.7){animArch(el,t,tk,1.5);el.style.display='block';el.style.zIndex=k;
        const ex=k===5?0:E(t,tk+1.3,tk+1.7,'inOutCubic');tf(el,{x:540-ex*320,y:990,s:1-ex*.14,op:1-ex,r:-ex*4});}
      else el.style.display='none';});
    const lp=E(t,t0+.45,t0+.85),lx=E(t,t0+1.25,t0+1.5,'lin');
    $('s3cap').textContent=DEF[i][1];$('s3sub').textContent=DEF[i][2];
    tf($('s3cap'),{c:false,x:0,y:1650+(1-lp)*20,op:lp*(1-lx)});tf($('s3sub'),{c:false,x:0,y:1715+(1-lp)*20,op:lp*(1-lx)});
    $('s3cnt').textContent=`0${i+1} / 06`;$('s3cnt').style.opacity=E(t,6.3,6.6)*(1-E(t,14.7,15,'lin'));
  }

  /* S4 15–19 */
  if(show('s4',t,14.9,19.1)){
    $('s4').style.opacity=E(t,14.9,15.2,'lin');
    const kb=seg(t,15,17.1);tf($('s4img'),{c:false,x:0,y:-140-kb*60,s:1.04+kb*.06});$('s4img').style.transformOrigin='30% 30%';
