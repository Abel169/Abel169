#grain{position:absolute;inset:0;width:1080px;height:1920px;mix-blend-mode:overlay;opacity:.07;pointer-events:none;z-index:50}
#flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none;z-index:51}
